<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Castle Busters</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;color:#e0e0e0;font-family:system-ui,sans-serif;overflow-x:hidden;min-height:100vh}
.neon-p{color:#ff2d95;text-shadow:0 0 10px #ff2d9555}
.neon-g{color:#39ff14;text-shadow:0 0 10px #39ff1455}
#app{max-width:640px;margin:0 auto;min-height:100vh;position:relative}
.screen{display:none;padding:16px;animation:fadeIn .3s}
.screen.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.btn{display:inline-block;padding:12px 24px;border:none;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;transition:.2s;text-align:center}
.btn-primary{background:linear-gradient(135deg,#ff2d95,#ff6b35);color:#fff}
.btn-primary:hover{transform:scale(1.05);box-shadow:0 4px 20px #ff2d9555}
.btn-secondary{background:linear-gradient(135deg,#39ff14,#00b894);color:#0a0a12}
.btn-secondary:hover{transform:scale(1.05);box-shadow:0 4px 20px #39ff1455}
.btn-ghost{background:#1a1a2e;color:#e0e0e0;border:1px solid #333}
.btn-ghost:hover{background:#252540}
.btn-danger{background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff}
.btn-small{padding:6px 14px;font-size:13px;border-radius:8px}
.card{background:#151523;border:1px solid #252540;border-radius:14px;padding:14px;margin-bottom:10px}
.card-hero{display:flex;gap:10px;align-items:center}
.hero-avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:#1a1a2e;border:2px solid #ff2d9555}
.title-bar{font-size:22px;font-weight:bold;padding:12px 0;display:flex;align-items:center;gap:8px}
.stats-bar{display:flex;gap:12px;font-size:13px;padding:8px 0;flex-wrap:wrap}
.stat-item{background:#11111c;padding:4px 10px;border-radius:8px;border:1px solid #252540}
.grid-castle{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:10px 0}
.floor-label{font-size:11px;color:#888;text-align:center;padding:2px}
.slot{aspect-ratio:1;background:#0d0d18;border:1px solid #252540;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:.2s;position:relative}
.slot:hover{border-color:#ff2d95;transform:scale(1.08)}
.slot.built{background:#15152a;border-color:#39ff1455}
.slot.locked{opacity:.3;cursor:not-allowed}
.shop-grid{display:grid;grid-template-columns:1fr;gap:8px}
.shop-item{display:flex;gap:10px;align-items:center;padding:10px;background:#11111c;border-radius:10px;border:1px solid #252540}
.shop-icon{font-size:28px;width:44px;text-align:center}
.map-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.map-node{padding:14px 8px;border-radius:12px;text-align:center;cursor:pointer;transition:.2s;font-size:13px}
.map-node:hover{transform:scale(1.05)}
.map-node.battle{background:linear-gradient(135deg,#2a1010,#3a1515);border:1px solid #e74c3c55}
.map-node.shop{background:#10152a;border:1px solid #39ff1455}
.map-node.castle{background:#1a1025;border:1px solid #ff2d9555}
.map-node.locked{opacity:.4;cursor:not-allowed}
.map-node.done{opacity:.6}
.battle-arena{background:#0d0d18;border-radius:14px;padding:12px;margin-bottom:10px}
.hp-bar{height:20px;background:#222;border-radius:10px;overflow:hidden;position:relative;margin:4px 0}
.hp-fill{height:100%;border-radius:10px;transition:.5s;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;color:#fff}
.hp-player{background:linear-gradient(90deg,#39ff14,#00b894)}
.hp-enemy{background:linear-gradient(90deg,#e74c3c,#c0392b)}
.hero-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.hero-chip{padding:4px 10px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid #333;background:#11111c}
.hero-chip.active{border-color:#ff2d95;background:#ff2d9522}
.hero-chip.cooldown{opacity:.4}
.log-box{max-height:150px;overflow-y:auto;font-size:12px;line-height:1.6;padding:8px;background:#08080f;border-radius:8px;margin-top:8px}
.log-entry{padding:2px 0;border-bottom:1px solid #15151f}
.gold-display{color:#ffd700;font-weight:bold}
.mana-display{color:#00bfff;font-weight:bold}
.floor-selector{display:flex;gap:4px;margin-bottom:6px}
.floor-tab{padding:6px 12px;border-radius:8px;font-size:13px;cursor:pointer;background:#11111c;border:1px solid #252540}
.floor-tab.active{background:#ff2d95;color:#fff;border-color:#ff2d95}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#151523;border:1px solid #ff2d95;padding:10px 20px;border-radius:10px;z-index:999;font-size:14px;display:none}
.toast.show{display:block;animation:.3s slideDown}
@keyframes slideDown{from{top:-50px}to{top:16px}}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:#000a;z-index:99;display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.show{display:flex}
.modal{background:#151523;border-radius:16px;padding:20px;max-width:400px;width:100%;border:1px solid #252540}
.result-screen{text-align:center;padding:30px 16px}
.result-icon{font-size:60px;margin-bottom:10px}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:bold}
.badge-new{background:#39ff1422;color:#39ff14;border:1px solid #39ff1455}
.badge-paid{background:#ffd70022;color:#ffd700;border:1px solid #ffd70055}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="modal" class="modal-overlay"><div class="modal" id="modalContent"></div></div>
<script>

<!-- ЭКРАН ВЫБОРА ГЕРОЯ -->
<div id="screen-heroes" class="screen">
<h2>👥 Выбор героя</h2>
<p style="color:#888;font-size:13px;margin-bottom:10px">Выбери героя для битвы. Каждый имеет уникальную способность.</p>

</div>
</div>

  // ===== НАВИГАЦИЯ =====
  showScreen(name) {
    this.state.screen = name;
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));

    if (el) el.classList.add('active');
    this.render();
  },

  // ===== РЕНДЕР ЭКРАНОВ =====
  render() {
    const s = this.state;
    switch(s.screen) {
      case 'menu': this.renderMenu(); break;
      case 'heroes': this.renderHeroes(); break;
      case 'shop': this.renderShop(); break;
      case 'castle': this.renderCastle(); break;
      case 'map': this.renderMap(); break;
      case 'battle': this.renderBattle(); break;
      case 'ranking': this.renderRanking(); break;
      case 'guide': this.renderGuide(); break;
    }
  },

  renderMenu() {
    const p = this.state.player;
    document.getElementById('menu-stats').innerHTML = `
      <div class="stat-row">
        <span class="stat-icon">💰</span><span>${p.gold}</span>
        <span class="stat-icon">🔷</span><span>${p.mana}</span>
        <span class="stat-icon">💎</span><span>${p.gems}</span>
      </div>
      <div class="stat-row">
        <span>Победы:</span><b>${p.wins}</b>
        <span>Поражения:</span><b>${p.losses}</b>
        <span>Рейтинг:</span><b>${p.rating}</b>
      </div>`;
    document.getElementById('menu-hero').textContent = p.selectedHero ? this.heroes[p.selectedHero].name : 'Не выбран';
    document.getElementById('menu-castle-hp').textContent = `${p.castle.hp}/${p.castle.maxHp} | Этаж ${p.castle.floors}/4`;
  },

  renderHeroes() {
    const container = document.getElementById('heroes-list');
    let html = '';
    for (const [key, h] of Object.entries(this.heroes)) {
      const owned = this.state.player.gold >= h.cost || key === 'summer';
      const selected = this.state.player.selectedHero === key;
      html += `
        <div class="hero-card ${selected ? 'selected' : ''}" style="border-color:${h.color}">
          <div class="hero-icon">${h.icon}</div>
          <div class="hero-name" style="color:${h.color}">${h.name}</div>
          <div class="hero-title">${h.title}</div>
          <div class="hero-stats">
            ❤️ ${h.hp} · ⚔️ ${h.attack} · 🛡️ ${h.defense} · 💨 ${h.speed}
          </div>
          <div class="hero-ability">
            <b>${h.abilityName}</b>: ${h.abilityDesc}
          </div>
          ${selected 
            ? '<button class="btn btn-selected" disabled>✓ Выбран</button>'
            : `<button class="btn" onclick="Game.selectHero('${key}')" ${!owned && key!=='summer' ? `disabled>💎 ${h.cost}</button>` : '>Выбрать</button>'}`}
        </div>`;
    }
    container.innerHTML = html;
  },

  selectHero(key) {
    const h = this.heroes[key];
    if (key !== 'summer' && this.state.player.gold < h.cost) return;
    if (key !== 'summer') this.state.player.gold -= h.cost;
    this.state.player.selectedHero = key;
    this.renderHeroes();
    this.renderMenu();
  },

  renderShop() {
    const p = this.state.player;
    let html = '';
    for (const [key, u] of Object.entries(this.unitTypes)) {
      const count = p.units.filter(u2 => u2.type === key).length;
      html += `
        <div class="shop-item">
          <span class="shop-icon">${u.icon}</span>
          <div class="shop-info">
            <b>${u.name}</b> — ❤️${u.hp} ⚔️${u.attack} 🛡️${u.defense}
            <br><small>В армии: ${count}</small>
          </div>
          <button class="btn" onclick="Game.buyUnit('${key}')" ${p.gold < u.cost ? 'disabled' : ''}>
            💰 ${u.cost}
          </button>
        </div>`;
    }
    document.getElementById('shop-list').innerHTML = html;
    document.getElementById('shop-gold').textContent = p.gold;
  },

  buyUnit(type) {
    const u = this.unitTypes[type];
    if (this.state.player.gold < u.cost) return;
    this.state.player.gold -= u.cost;
    this.state.player.units.push({ type, hp: u.hp, maxHp: u.hp });
    this.renderShop();
    this.renderMenu();
  },

  renderCastle() {
    const p = this.state.player;
    let html = `
      <div class="castle-view">
        <div class="castle-display">
          <div class="castle-building" style="--floors:${p.castle.floors}">
            ${Array.from({length:p.castle.floors},(_,i)=>`<div class="floor" style="bottom:${i*60}px"></div>`).join('')}
            <div class="castle-base"></div>
          </div>
          <div class="castle-info">
            <h3>Замок — Уровень ${p.castle.level}</h3>
            <p>❤️ ${p.castle.hp}/${p.castle.maxHp}</p>
            <p>Этажи: ${p.castle.floors}/4</p>
          </div>
        </div>
        <div class="buildings-grid">`;
    
    for (const [key,b] of Object.entries(this.buildingTypes)) {
      const lvl = p.buildings[key] || 0;
      const maxLvl = b.cost.gold.length;
      const nextCost = lvl < maxLvl ? b.cost.gold[lvl] : null;
      html += `
        <div class="building-card">
          <b>${b.name} (Ур.${lvl})</b>
          <p>${b.desc}</p>
          ${nextCost 
            ? `<button class="btn" onclick="Game.build('${key}')" ${p.gold < nextCost ? 'disabled' : ''}>💰 ${nextCost}</button>`
            : '<span class="max-lvl">Макс</span>'}
        </div>`;
    }
    
    // Улучшения замка
    const upgradeCost = p.castle.level * 200;
    html += `
        </div>
        <div class="castle-upgrades">
          <h3>Улучшения замка</h3>
          <button class="btn btn-upgrade" onclick="Game.upgradeCastle()" ${p.gold < upgradeCost || p.castle.floors >= 4 ? 'disabled' : ''}>
            ${p.castle.floors >= 4 ? 'Максимальная высота' : `⬆️ Построить этаж (${upgradeCost}💰)`}
          </button>
          <button class="btn btn-repair" onclick="Game.repairCastle()" ${p.gold < 50 || p.castle.hp >= p.castle.maxHp ? 'disabled' : ''}>
            🔧 Починить (+50 HP за ${50}💰)
          </button>
        </div>
      </div>`;
    document.getElementById('castle-content').innerHTML = html;
    document.getElementById('castle-gold').textContent = p.gold;
  },

  upgradeCastle() {
    const p = this.state.player;
    if (p.castle.floors >= 4) return;
    const cost = p.castle.level * 200;
    if (p.gold < cost) return;
    p.gold -= cost;
    p.castle.floors++;
    p.castle.maxHp += 200;
    p.castle.hp += 200;
    p.castle.level++;
    this.renderCastle();
    this.renderMenu();
  },

  repairCastle() {
    const p = this.state.player;
    if (p.gold < 50 || p.castle.hp >= p.castle.maxHp) return;
    p.gold -= 50;
    p.castle.hp = Math.min(p.castle.maxHp, p.castle.hp + 50);
    this.renderCastle();
    this.renderMenu();
  },

  build(key) {
    const p = this.state.player;
    const b = this.buildingTypes[key];
    const lvl = p.buildings[key] || 0;
    const cost = b.cost.gold[lvl];
    if (!cost || p.gold < cost) return;
    p.gold -= cost;
    p.buildings[key]++;
    if (key === 'tower') { p.castle.maxHp += 50; p.castle.hp += 50; }
    this.renderCastle();
    this.renderMenu();
  },

  renderMap() {
    const m = this.state.map;
    let html = '<div class="map-grid">';
    m.nodes.forEach((n,i) => {
      const reachable = i === m.currentNode || i === m.currentNode + 1 || (n.type === 'shop' && n.cleared);
      html += `
        <div class="map-node ${n.cleared ? 'cleared' : ''} ${reachable ? 'reachable' : ''}" 
             onclick="${reachable ? `Game.visitNode(${i})` : ''}">
          <div class="node-icon">${this.nodeIcon(n.type)}</div>
          <div class="node-name">${n.name}</div>
          ${n.cleared ? '<small>✓ Зачищено</small>' : ''}
        </div>`;
    });
    html += '</div>';
    document.getElementById('map-content').innerHTML = html;
  },

  nodeIcon(type) {
    return {'camp':'🏕️','resource':'⛏️','village':'🏘️','mage':'🔮','forge':'🔨',
            'bandits':'🗡️','ruins':'🏚️','boss':'🐉','shop':'🛒','arena':'⚔️',
            'shrine':'✨','enemy_castle':'🏰'}[type] || '?';
},

visitNode(idx) {
    const n = this.state.map.nodes[idx];
    if (n.cleared && n.type !== 'shop') return;
    
    switch(n.type) {
      case 'camp':
      case 'resource':
      case 'village':
      case 'mage':
      case 'forge':
      case 'shrine':
        this.claimReward(n);
        break;
      case 'shop':
        this.showScreen('shop');
        return;
      case 'bandits':
      case 'ruins':
      case arena:
      case'boss':
      case'enemy_castle':
        this.startBattle(n);
        return;
    }
},

claimReward(n) {
if(n.reward) {
if(n.reward.gold) this.state.player.gold += n.reward.gold;
if(n.reward.mana) this.state.player.mana += n.reward.mana;
if(n.reward.gems) this.state.player.gems += n.reward.gems;
if(n.reward.rating) this.state.player.rating += n.reward.rating;
}
n.cleared = true;
this.state.map.currentNode = n.id;
this.renderMap();
this.renderMenu();
},

// ===== БОЕВАЯ СИСТЕМА =====
startBattle(nodeData) {
const p = this.state.player;
if(!p.selectedHero) {
alert('Выбери героя сначала!');
this.showScreen('heroes');
return;
}

const heroData = JSON.parse(JSON.stringify(this.heroes[p.selectedHero]));
heroData.hp = heroData.hp; heroData.abilityCharges = heroData.abilityCooldown;

// Генерация врага
const enemyHeroKey = Object.keys(this.heroes)[Math.floor(Math.random()*Object.keys(this.heroes).length)];
const enemyHero = JSON.parse(JSON.stringify(this.heroes[enemyHeroKey]));
enemyHero.hp = enemyHero.hp;

const enemyUnits = [];
const unitKeys = Object.keys(this.unitTypes);
for(let i=0;i<3+Math.floor(Math.random()*3);i++) {
const uk = unitKeys[Math.floor(Math.random()*unitKeys.length)];
const ud = this.unitTypes[uk];
enemyUnits.push({type:'e_'+uk,hp:ud.hp,maxHp:ud.hp});
}

this.state.battle = {
turn:1,currentTurn:'player',
log:[],
playerHero:{...heroData},
playerUnits:p.units.map(u=>({...u})),
playerCastleHp:p.castle.hp,
enemyHero:{...enemyHero},
enemyUnits,
enemyCastleHp:this.state.enemy.castle.hp,
nodeData,
roundCounter:{playerHeroAbilityCharge:-1}
};

this.showScreen('battle');
},

renderBattle() {
const b = this.state.battle;
if(!b) return;

let playerUnitsHtml = b.playerUnits.map((u,i)=>{
const ud = u.type.startsWith('e_')?this.unitTypes[u.type.slice(2)]:this.unitTypes[u.type];
return `<div class="unit-card player-unit" onclick="Game.selectTarget('unit',${i})">
${ud?ud.icon:'❓'} ❤️${u.hp}/${u.maxHp}
</div>`;}).join('');

let enemyUnitsHtml = b.enemyUnits.map((u,i)=>{
const ud=this.unitTypes[u.type.replace('e_','')];
return `<div class="unit-card enemy-unit" onclick="Game.attackUnit(${i})">
${ud?ud.icon:'❓'} ❤️${u.hp}/${u.maxHp}
</div>`;}).join('');

document.getElementById('battle-field').innerHTML = `
<div class="battle-area">
<div class="enemy-side">
<div class="hero-bar enemy-hero-bar">
<span style="color:${b.enemyHero.color}">${b.enemyHero.icon} ${b.enemyHero.name}</span>
<span>❤️ ${b.enemyHero.hp}</span>
</div>
<div class="units-row">${enemyUnitsHtml || '<small>Нет юнитов</small>'}</div>
<div class="castle-bar enemy-castle-bar">🏰 Вражеский замок ❤️${b.enemyCastleHp}</div>
</div>
<div class="battle-log" id="battle-log">${b.log.slice(-5).map(l=>`<p>${l}</p>`).join('')}</div>
<div class="player-side">
<div class="castle-bar player-castle-bar">🏰 Ваш замок ❤️${b.playerCastleHp}</div>
<div class="units-row">${playerUnitsHtml || '<small>Нет юнитов</small>'}</div>
<div class="hero-bar player-hero-bar">
<span style="color:${b.playerHero.color}">${b.playerHero.icon} ${b.playerHero.name}</span>
<span>❤️ ${b.playerHero.hp}</span>
<button class="btn-sm" onclick="Game.useHeroAbility()">⚡ ${b.playerHero.abilityName}</button>
</div>
</div>
</div>
<div class="battle-controls">
<button class="btn" onclick="Game.endTurn()">Конец хода ⏭️</button>
<button class="btn btn-danger" onclick="Game.fleeBattle()">Отступить 🏃</button>
</div>`;

// Прокрутка лога
const logEl=document.getElementById('battle-log');
if(logEl) logEl.scrollTop=logEl.scrollHeight;
},

selectTarget(type,idx){ /* заглушка для выбора цели */ },

attackUnit(idx) {
const b=this.state.battle;
if(!b||b.currentTurn!=='player') return;
if(b.playerUnits.length===0&&!b.playerHero) return;

// Атака героем первого юнита
const dmg=Math.max(1,b.playerHero.attack-b.enemyUnits[idx].hp*0);
b.enemyUnits[idx].hp-=dmg;
this.addLog(`Ваш герой наносит ${dmg} урона по вражескому юниту!`);

if(b.enemyUnits[idx].hp<=0){
b.enemyUnits.splice(idx,1);
this.addLog('Вражеский юнит уничтожен!');
}

this.checkWin();
if(b.currentTurn==='enemy') return; // проверка победы может сменить экран
this.aiTurn();
},

useHeroAbility() {
const b=this.state.battle;
if(!b||b.currentTurn!=='player') return;
const h=b.playerHero;

switch(h.name){
case'Summer':
h.abilityCharges=2; // следующий ход x2
this.addLog('☀️ Summer заряжает энергию! Следующая атака ×2');
break;
case'Fantom':
h.stealth=true;
this.addLog('👻 Fantom входит в стелс! Поглотит следующую атаку');
break;
case'Volt':
b.enemyUnits.forEach(u=>{u.hp-=20;});
b.enemyUnits=b.enemyUnits.filter(u=>u.hp>0);
this.addLog('⚡ Volt бьёт цепной молнией всех врагов!');
break;
case'Blade':
h.doubleStrike=true;
this.addLog('🗡️ Blade готовит двойной удар!');
break;
case'Titan Prime':
b.enemyUnits.forEach(u=>{u.hp-=30;});
b.enemyCastleHp-=50;
b.enemyUnits=b.enemyUnits.filter(u=>u.hp>0);
this.addLog('👑 Titan Prime вызывает землетрясение!');
break;
}

this.checkWin();
},

endTurn(){
const b=this.state.battle;
if(!b||b.currentTurn!=='player') return;

// Summer зарядка срабатывает при пропуске хода
if(b.playerHero&&b.playerHero.abilityCharges===2){
// ничего, срабатывает на след ходу
}

this.aiTurn();
},

aiTurn(){
const b=this.state.battle;
if(!b) return;

// Лимит лога
if(b.log.length>30) b.log=b.log.slice(-20);

// Враг атакует
if(b.enemyUnits.length>0){
// Каждый вражеский юнит атакует случайного игрока или замок
for(const eu of b.enemyUnits){
const targets=[];
if(b.playerUnits.length>0){
targets.push(()=>{const idx=Math.floor(Math.random()*b.playerUnits.length);const d=15;b.playerUnits[idx].hp-=d;this.addLog(`Враг бьёт вашего юнита на ${d}`);if(b.playerUnits[idx].hp<=0)b.playerUnits.splice(idx,1);});
}
targets.push(()=>{const d=10;b.playerCastleHp-=d;this.addLog(`Враг атакует ваш замок на ${d}`);});
targets[Math.floor(Math.random()*targets.length)]();
}
}else if(b.enemyHero&&b.enemyHero.hp>0){
// Герой врага атакует
const dmg=Math.max(5,b.enemyHero.attack-Math.floor(Math.random()*8));
if(b.playerUnits.length>0&&Math.random()>0.4){
const idx=Math.floor(Math.random()*b.playerUnits.length);
b.playerUnits[idx].hp-=dmg;
this.addLog(`${b.enemyHero.name} бьёт вашего юнита на ${dmg}`);
if(b.playerUnits[idx].hp<=0)b.playerUnits.splice(idx,1);
}else{
b.playerCastleHp-=dmg;
this.addLog(`${b.enemyHero.name} атакует ваш замок на ${dmg}`);
}
}

// Проверка поражения
if(b.playerCastleHp<=0||(b.playerHero.hp<=0&&b.playerUnits.length===0)){
this.loseBattle();
return;
}

// Доход за ход
this.collectIncome();

b.turn++;
b.currentTurn='player';
this.renderBattle();
},

collectIncome(){
const p=this.state.player;
let goldIncome=(p.buildings.mine||1)*20;
let manaIncome=(p.buildings.mageTower||0)*10;
p.gold+=goldIncome;p.mana+=manaIncome;
},

checkWin(){
const b=this.state.battle;
if(!b) return;

if(b.enemyUnits.length===0&&(!b.enemyHero||b.enemyHero.hp<=0)){
this.winBattle();
return;
}
},

winBattle(){
const b=this.state.battle;
const r=b.nodeData?.reward||{gold:100};
this.addLog('🏆 ПОБЕДА!');
this.state.player.wins++;
this.state.player.rating+=30;

if(r.gold)this.state.player.gold+=r.gold;
if(r.mana)this.state.player.mana+=r.mana;
if(r.gems)this.state.player.gems+=r.gems;

// Восстановление HP героя после боя
this.heroes[this.state.player.selectedHero].hp=this.heroes[this.state.player.selectedHero].hp;

// Отметить узел как зачищенный
if(b.nodeData){
b.nodeData.cleared=true;
this.state.map.currentNode=b.nodeData.id;
}

setTimeout(()=>{
alert(`🏆 Победа!\n\nНаграда:\n💰 +${r.gold||0}\n🔷 +${r.mana||0}\n💎 +${r.gems||0}\nРейтинг +30`);
this.state.battle=null;
this.showScreen('map');
},800);

this.renderBattle();
},

loseBattle(){
this.addLog('💀 Поражение...');
this.state.player.losses++;
this.state.player.rating=Math.max(0,this.state.player.rating-20);

setTimeout(()=>{
alert('💀 Поражение...\n\nРейтинг -20\nГерой восстанавливается через ход.');
this.heroes[this.state.player.selectedHero].hp=this.heroes[this.state.player.selectedHero].hp+20; // лёгкое восстановление
this.state.battle=null;
this.showScreen('map');
},800);
},

fleeBattle(){
if(confirm('Отступить? Вы потеряете рейтинг.')){
this.state.player.rating=Math.max(0,this.state.player.rating-10);
this.state.battle=null;
this.showScreen('map');
}
},

addLog(msg){
const b=this.state.battle;if(!b)return;b.log.push(msg);if(b.log.length>50)b.log.shift();
},

renderRanking(){
document.getElementById('ranking-content').innerHTML=`
<div class="ranking-list">
<div class="rank-row you"><span class="rank-pos">#1</span><span class="rank-name">Настя (Вы)</span><span class="rank-score">${this.state.player.rating}</span></div>
<div class="rank-row"><span class="rank-pos">#2</span><span class="rank-name">DarkLord99</span><span class="rank-score">${Math.max(800,this.state.player.rating-50)}</span></div>
<div class="rank-row"><span class="rank-pos">#3</span><span class="rank-name">ShadowKing</span><span class="rank-score">${Math.max(750,this.state.player.rating-120)}</span></div>
<div class="rank-row"><span class="rank-pos">#4</span><span class="rank-name">FrostQueen</span><span class="rank-score">${Math.max(700,this.state.player.rating-200)}</span></div>
<div class="rank-row"><span class="rank-pos">#5</span><span class="rank-name">NeonWarrior</span><span class="rank-score">${Math.max(650,this.state.player.rating-280)}</span></div>
</div>`;
},

renderGuide(){
document.getElementById('guide-content').innerHTML=`
<h3>Как играть в Castle Busters</h3>
<div class="guide-section">
<h4>🏰 Замок</h4>
<p>Стройте этажи (до 4), улучшайте здания. Шахта даёт золото, магбашня — ману, кузница усиливает атаку.</p>
</div>
<div class="guide-section">
<h4>⚔️ Герои</h4>
<p><b>Summer</b> — копит энергию, через ход ×2 урон<br><b>Fantom</b> — стелс поглощает атаку<br><b>Volt</b> — цепная молния по всем<br><b>Blade</b> — двойной удар<br><b>Titan Prime</b> — легендарный титан</p>
</div>
<div class="guide-section">
<h4>🗺️ Карта</h4>
<p>Двигайтесь по узлам карты. Ресурсы дают золото и ману, лагеря разбойников — бой с наградой. Дойдите до вражеского замка!</p>
</div>
<div class="guide-section">
<h4>🛒 Магазин</h4>
<p>Покупайте юнитов за золото. Рыцарь — танк, лучник — дальний бой, бомбардировщик — урон по площади.</p>
</div>`;
},

init(){ this.showScreen('menu'); }
};

window.addEventListener('DOMContentLoaded',()=>Game.init());
</script>
</body>
</html>
