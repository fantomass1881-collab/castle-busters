<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castle Busters - PvP Battle</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* existing styles omitted for brevity in this listing; keep same as before */
        /* We'll add modal and unit-card related styles below */

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .draft-modal {
            width: 820px;
            max-width: 95%;
            background: linear-gradient(180deg,#0f1530 0%, #1b1230 100%);
            border: 2px solid var(--neon-cyan);
            padding: 20px;
            border-radius: 8px;
            color: var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0,245,255,0.15);
        }
        .draft-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
        .draft-grid { display:flex; gap:12px; flex-wrap:wrap; }
        .unit-card {
            width: 180px;
            background: linear-gradient(180deg,#1b1b2f 0%, #151524 100%);
            border: 2px solid rgba(0,245,255,0.06);
            padding: 10px;
            border-radius: 6px;
            cursor:pointer;
            transition: transform .12s, box-shadow .12s, border-color .12s;
        }
        .unit-card.selected { transform: translateY(-6px); box-shadow: 0 8px 20px rgba(0,0,0,0.6); border-color: var(--neon-pink); }
        .unit-card h4 { margin-bottom:6px; color:var(--neon-pink); }
        .unit-card p { font-size:0.85rem; color:var(--neon-cyan); }
        .slot-indicators { display:flex; gap:6px; align-items:center; }
        .slot { width:18px; height:18px; border:1px solid rgba(0,245,255,0.2); border-radius:3px; }
        .slot.filled { background:var(--neon-pink); border-color:var(--neon-pink); }
        .draft-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
        .btn-primary { background:var(--neon-cyan); color:var(--dark-bg); padding:8px 12px; border-radius:4px; border:none; cursor:pointer; }
        .btn-secondary { background:transparent; color:var(--neon-cyan); border:1px solid rgba(0,245,255,0.12); padding:6px 10px; border-radius:4px; cursor:pointer; }

        /* keep rest of CSS from index.html unchanged */
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header> ... </header>

        <!-- Battle Area -->
        <div class="battle-area">
            <!-- existing content unchanged (castles, logs, controls) -->

            <!-- Control Panel -->
            <div class="control-panel">
                <div style="display:flex; gap:8px;">
                  <button class="control-btn" id="unitWrecker">WRECKER</button>
                  <button class="control-btn" id="unitBomber">BOMBER</button>
                  <button class="control-btn" id="unitNapalmer">NAPALMER</button>
                </div>
                <button class="control-btn" id="lineBtn">LINE FIRE</button>
                <button class="control-btn" id="attackBtn">⚔️ ATTACK</button>
                <button class="control-btn" id="abilityBtn">✨ ABILITY</button>
                <button class="control-btn" id="forwardBtn">→ FORWARD</button>
                <button class="control-btn" id="backBtn">← BACKWARD</button>
            </div>
        </div>

        <!-- Footer -->
        <footer>
            🏰 Castle Busters v3.0 | Современная PvP Боевая Система | Режим: 1v1
        </footer>
    </div>

    <!-- Draft modal (hidden by default) -->
    <div id="draftModal" class="modal-overlay" style="display:none;">
      <div class="draft-modal" role="dialog" aria-modal="true">
        <div class="draft-header">
          <div>
            <h3 style="margin:0;">Сбор состава — выберите до 8 юнитов</h3>
            <div style="font-size:0.85rem; color:var(--neon-green);">Состав определяет доступные способности в матче</div>
          </div>
          <div>
            <div class="slot-indicators" id="slotIndicators"></div>
          </div>
        </div>

        <div class="draft-grid" id="draftGrid">
          <!-- unit cards inserted by JS -->
        </div>

        <div class="draft-actions">
          <button class="btn-secondary" id="draftCancel">Отмена</button>
          <button class="btn-primary" id="draftStart">Начать матч</button>
        </div>
      </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
