<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castle Busters - PvP Battle</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --neon-pink: #ff006e;
            --neon-cyan: #00f5ff;
            --neon-green: #39ff14;
            --neon-purple: #b200ff;
            --neon-orange: #ff6600;
            --dark-bg: #0a0e27;
        }

        body {
            font-family: 'Roboto Mono', monospace;
            background: linear-gradient(135deg, #1a1a3e 0%, #2d0052 100%);
            color: var(--neon-cyan);
            overflow: hidden;
            user-select: none;
        }

        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: linear-gradient(90deg, rgba(0, 245, 255, 0.1) 0%, rgba(255, 0, 110, 0.1) 100%);
            border-bottom: 3px solid var(--neon-cyan);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.3);
        }

        .header-left, .header-center, .header-right {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 20px;
            color: var(--neon-green);
        }

        .header-center {
            justify-content: center;
            font-family: 'Orbitron', monospace;
            font-size: 1.5rem;
            text-shadow: 0 0 15px var(--neon-pink);
            color: var(--neon-pink);
        }

        .header-right {
            justify-content: flex-end;
        }

        .player-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .stat {
            background: rgba(0, 245, 255, 0.1);
            padding: 5px 10px;
            border: 1px solid var(--neon-cyan);
            border-radius: 3px;
        }

        /* Battle Arena */
        .battle-area {
            flex: 1;
            display: flex;
            position: relative;
            background: linear-gradient(180deg, #4a6fa5 0%, #2d4a7c 50%, #1a3a5c 100%);
            overflow: hidden;
        }

        /* Background */
        .battle-background {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            opacity: 0.3;
        }

        .mountain {
            position: absolute;
            bottom: 0;
            opacity: 0.4;
        }

        .mountain-left {
            left: 10%;
            width: 300px;
            height: 300px;
            border-radius: 100% 0 0 0;
            background: linear-gradient(135deg, #8b7355 0%, #654321 100%);
        }

        .mountain-right {
            right: 10%;
            width: 300px;
            height: 300px;
            border-radius: 0 100% 0 0;
            background: linear-gradient(225deg, #8b7355 0%, #654321 100%);
        }

        /* Game Content */
        .game-content {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 0 50px 100px;
        }

        /* Castle */
        .castle-wrapper {
            position: relative;
            height: 300px;
            width: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .castle {
            position: relative;
            width: 200px;
            height: 240px;
            background: linear-gradient(135deg, #4a2c2a 0%, #2a1a1a 100%);
            border: 3px solid #8b6f47;
            border-radius: 5px 5px 30px 30px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        /* Castle Floors */
        .castle-floor {
            position: absolute;
            width: 100%;
            height: 40%;
            border-bottom: 2px solid #8b6f47;
            background: linear-gradient(90deg, rgba(100, 80, 60, 0.5) 0%, rgba(80, 60, 40, 0.5) 50%, rgba(100, 80, 60, 0.5) 100%);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 5px;
        }

        .floor-1 { top: 0; }
        .floor-2 { top: 40%; }
        .floor-3 { top: 80%; }

        .castle-block {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #8b6f47 0%, #5a4a2a 100%);
            border: 1px solid #6b5a3a;
            opacity: 1;
            transition: all 0.3s;
        }

        .castle-block.destroyed {
            opacity: 0;
            transform: scale(0);
        }

        .castle-tower {
            position: absolute;
            width: 30px;
            height: 80px;
            background: linear-gradient(135deg, #1a0f0a 0%, #0a0505 100%);
            border: 2px solid #8b6f47;
            top: -50px;
        }

        .tower-left {
            left: 10px;
        }

        .tower-right {
            right: 10px;
        }

        .tower-flag {
            position: absolute;
            width: 20px;
            height: 15px;
            background: var(--neon-pink);
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 10px var(--neon-pink);
        }

        /* Castle Legs */
        .castle-legs {
            position: absolute;
            bottom: -50px;
            width: 100%;
            height: 50px;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .leg {
            width: 15px;
            height: 50px;
            background: linear-gradient(90deg, #4a2c2a 0%, #2a1a1a 100%);
            border: 2px solid #8b6f47;
            border-radius: 0 0 10px 10px;
            animation: walkLeft 1s infinite;
            transform-origin: top center;
        }

        .leg-right {
            animation: walkRight 1s infinite;
        }

        @keyframes walkLeft {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-15deg); }
        }

        @keyframes walkRight {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(15deg); }
        }

        /* Health Bar */
        .health-bar-wrapper {
            width: 100%;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .health-bar {
            width: 100%;
            height: 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--neon-green);
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-green) 0%, var(--neon-cyan) 100%);
            width: 100%;
            transition: width 0.3s;
            box-shadow: 0 0 10px var(--neon-green);
        }

        .health-text {
            font-size: 0.8rem;
            text-align: center;
            color: var(--neon-green);
        }

        /* Units Display */
        .units-display {
            position: absolute;
            bottom: -80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .unit-icon {
            width: 40px;
            height: 40px;
            background: rgba(0, 245, 255, 0.1);
            border: 2px solid var(--neon-cyan);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            border-radius: 3px;
            animation: unitPulse 1s infinite;
        }

        @keyframes unitPulse {
            0%, 100% { box-shadow: 0 0 10px var(--neon-cyan); }
            50% { box-shadow: 0 0 20px var(--neon-cyan); }
        }

        /* Battle Log */
        .battle-log {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 300px;
            height: 200px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--neon-green);
            padding: 15px;
            overflow-y: auto;
            z-index: 5;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
        }

        .log-title {
            color: var(--neon-green);
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .log-entry {
            color: var(--neon-cyan);
            font-size: 0.75rem;
            margin-bottom: 5px;
            border-bottom: 1px solid rgba(0, 245, 255, 0.2);
            padding-bottom: 3px;
        }

        /* Control Panel */
        .control-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 5;
        }

        .control-btn {
            padding: 10px 20px;
            background: rgba(0, 245, 255, 0.1);
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            cursor: pointer;
            font-family: 'Orbitron', monospace;
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: all 0.3s;
            font-weight: bold;
        }

        .control-btn:hover {
            background: var(--neon-cyan);
            color: var(--dark-bg);
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        /* Damage Numbers */
        .damage-number {
            position: absolute;
            font-weight: bold;
            font-size: 2rem;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 0 0 10px currentColor;
        }

        .damage-red {
            color: #ff3333;
        }

        .damage-green {
            color: var(--neon-green);
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-60px);
            }
        }

        /* Footer */
        footer {
            background: linear-gradient(90deg, rgba(178, 0, 255, 0.1) 0%, rgba(0, 245, 255, 0.1) 100%);
            border-top: 2px solid var(--neon-purple);
            padding: 10px 30px;
            text-align: center;
            color: var(--neon-purple);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 245, 255, 0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--neon-cyan);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--neon-pink);
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .battle-area {
                flex-direction: column;
            }

            .game-content {
                flex-direction: column;
                gap: 50px;
            }

            .castle-wrapper {
                margin: 50px auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="header-left">
                <div class="player-header">
                    <span>🟢 GRINCHITA</span>
                    <div class="stat">💰 <span id="playerGold">1000</span></div>
                    <div class="stat">⚡ <span id="playerPower">100</span>%</div>
                </div>
            </div>
            
            <div class="header-center">
                ROUND <span id="roundNumber">1</span> | <span id="roundTimer">60</span>s
            </div>
            
            <div class="header-right">
                <div class="player-header">
                    <div class="stat">💰 <span id="enemyGold">1000</span></div>
                    <div class="stat">⚡ <span id="enemyPower">100</span>%</div>
                    <span>🤖 ENEMY</span>
                </div>
            </div>
        </header>

        <!-- Battle Area -->
        <div class="battle-area">
            <!-- Background -->
            <div class="battle-background">
                <div class="mountain mountain-left"></div>
                <div class="mountain mountain-right"></div>
            </div>

            <!-- Game Content -->
            <div class="game-content">
                <!-- Player Castle -->
                <div class="castle-wrapper" id="playerCastleWrapper">
                    <div class="castle" id="playerCastle">
                        <div class="castle-tower tower-left">
                            <div class="tower-flag"></div>
                        </div>
                        <div class="castle-tower tower-right">
                            <div class="tower-flag"></div>
                        </div>
                        
                        <div class="castle-floor floor-1">
                            <div class="castle-block"></div>
                            <div class="castle-block"></div>
                            <div class="castle-block"></div>
                        </div>
                        <div class="castle-floor floor-2">
                            <div class="castle-block"></div>
                            <div class="castle-block"></div>
                            <div class="castle-block"></div>
                        </div>
                        <div class="castle-floor floor-3">
                            <div class="castle-block"></div>
                            <div class="castle-block"></div>
                            <div class="castle-block"></div>
                        </div>

                        <div class="castle-legs">
                            <div class="leg"></div>
                            <div class="leg leg-right"></div>
                            <div class="leg"></div>
                        </div>
                    </div>

                    <div class="health-bar-wrapper">
                        <div class="health-bar">
                            <div class="health-fill" id="playerHealthBar" style="width: 100%"></div>
                        </div>
                        <div class="health-text">
                            <span id="playerHP">1000</span> / <span id="playerMaxHP">1000</span>
                        </div>
                    </div>

                    <div class="units-display">
                        <div class="unit-icon" title="Grinchita - Absorb">🟢</div>
                        <div class="unit-icon" title="Summer - Fire">☀️</div>
                        <div class="unit-icon" title="Fantom - Stealth">👻</div>
                    </div>
                </div>

                <!-- Enemy Castle -->
                <div class="castle-wrapper" id="enemyCastleWrapper">
                    <div class="castle" id="enemyCastle">
                        <div class="castle-tower tower-left">
                            <div class="tower-flag" style="background: var(--neon-orange);"></div>
                        </div>
                        <div class="castle-tower tower-right">
                            <div class="tower-flag" style="background: var(--neon-orange);"></div>
                        </div>
                        
                        <div class="castle-floor floor-1">
                            <div class="castle-block"></div>
                            <div class="castle-block"></div>
                            <div class="castle-block"></div>
                        </div>
                        <div class="castle-floor floor-2">
                            <div class="castle-block"></div>
                            <div class="castle-block"></div>
                            <div class="castle-block"></div>
                        </div>
                        <div class="castle-floor floor-3">
                            <div class="castle-block"></div>
                            <div class="castle-block"></div>
                            <div class="castle-block"></div>
                        </div>

                        <div class="castle-legs">
                            <div class="leg"></div>
                            <div class="leg leg-right"></div>
                            <div class="leg"></div>
                        </div>
                    </div>

                    <div class="health-bar-wrapper">
                        <div class="health-bar">
                            <div class="health-fill" id="enemyHealthBar" style="width: 100%"></div>
                        </div>
                        <div class="health-text">
                            <span id="enemyHP">1000</span> / <span id="enemyMaxHP">1000</span>
                        </div>
                    </div>

                    <div class="units-display">
                        <div class="unit-icon" title="Enemy Unit 1">🗡️</div>
                        <div class="unit-icon" title="Enemy Unit 2">🏹</div>
                        <div class="unit-icon" title="Enemy Unit 3">🔮</div>
                    </div>
                </div>
            </div>

            <!-- Battle Log -->
            <div class="battle-log">
                <div class="log-title">⚔️ Battle Log</div>
                <div id="battleLogContainer"></div>
            </div>

            <!-- Control Panel -->
            <div class="control-panel">
                <button class="control-btn" onclick="playerAttack()">⚔️ ATTACK</button>
                <button class="control-btn" onclick="playerAbility()">✨ ABILITY</button>
                <button class="control-btn" onclick="moveForward()">→ FORWARD</button>
                <button class="control-btn" onclick="moveBackward()">← BACKWARD</button>
            </div>
        </div>

        <!-- Footer -->
        <footer>
            🏰 Castle Busters v3.0 | Современная PvP Боевая Система | Режим: 1v1
        </footer>
    </div>

    <script>
        // Game State
        const gameState = {
            playerHP: 1000,
            playerMaxHP: 1000,
            playerGold: 1000,
            playerPower: 100,
            enemyHP: 1000,
            enemyMaxHP: 1000,
            enemyGold: 1000,
            enemyPower: 100,
            round: 1,
            roundTime: 60,
            gameRunning: true,
            playerPosition: 0,
            enemyPosition: 100,
            playerAbilityReady: true,
            abilityName: 'Absorb',
            damageMultiplier: 1
        };

        // Characters Database
        const characters = {
            grinchita: {
                icon: '🟢',
                name: 'Grinchita',
                ability: 'Absorb',
                description: 'Поглощает следующий урон без потери HP',
                baseDamage: 60
            },
            summer: {
                icon: '☀️',
                name: 'Summer',
                ability: 'Power Strike',
                description: 'Мощный удар с x2 урон',
                baseDamage: 80
            },
            fantom: {
                icon: '👻',
                name: 'Fantom',
                ability: 'Stealth',
                description: 'Скрывается и поглощает урон',
                baseDamage: 50
            }
        };

        // Add Log Entry
        function addLog(message, type = 'info') {
            const logContainer = document.getElementById('battleLogContainer');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = message;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;

            if (logContainer.children.length > 15) {
                logContainer.removeChild(logContainer.firstChild);
            }
        }

        // Show Damage Number
        function showDamage(castleId, damage, type = 'damage') {
            const castle = document.getElementById(castleId);
            const damageEl = document.createElement('div');
            damageEl.className = `damage-number ${type === 'heal' ? 'damage-green' : 'damage-red'}`;
            damageEl.textContent = type === 'heal' ? `+${damage}` : `-${damage}`;
            damageEl.style.left = Math.random() * 100 + 'px';
            damageEl.style.top = '50%';
            castle.appendChild(damageEl);
            setTimeout(() => damageEl.remove(), 1000);
        }

        // Destroy Castle Blocks
        function destroyBlock(castleElement) {
            const blocks = castleElement.querySelectorAll('.castle-block:not(.destroyed)');
            if (blocks.length > 0) {
                const randomBlock = blocks[Math.floor(Math.random() * blocks.length)];
                randomBlock.classList.add('destroyed');
            }
        }

        // Update UI
        function updateUI() {
            // HP Bars
            const playerPercent = (gameState.playerHP / gameState.playerMaxHP) * 100;
            const enemyPercent = (gameState.enemyHP / gameState.enemyMaxHP) * 100;

            document.getElementById('playerHealthBar').style.width = Math.max(0, playerPercent) + '%';
            document.getElementById('enemyHealthBar').style.width = Math.max(0, enemyPercent) + '%';

            // HP Text
            document.getElementById('playerHP').textContent = Math.max(0, gameState.playerHP);
            document.getElementById('enemyHP').textContent = Math.max(0, gameState.enemyHP);

            // Stats
            document.getElementById('playerGold').textContent = gameState.playerGold;
            document.getElementById('playerPower').textContent = gameState.playerPower;
            document.getElementById('enemyGold').textContent = gameState.enemyGold;
            document.getElementById('enemyPower').textContent = gameState.enemyPower;
            document.getElementById('roundNumber').textContent = gameState.round;

            // Check Win/Lose
            if (gameState.playerHP <= 0) {
                addLog('💀 ПОРАЖЕНИЕ! Замок разрушен!');
                gameState.gameRunning = false;
            } else if (gameState.enemyHP <= 0) {
                addLog('🏆 ПОБЕДА! Враг разрушен!');
                gameState.gameRunning = false;
            }
        }

        // Player Attack
        function playerAttack() {
            if (!gameState.gameRunning) return;

            const baseDamage = 80;
            const damage = Math.floor(baseDamage * gameState.damageMultiplier);
            gameState.enemyHP -= damage;

            addLog(`⚔️ GRINCHITA наносит ${damage} урона!`);
            showDamage('enemyCastle', damage);
            destroyBlock(document.getElementById('enemyCastle'));

            gameState.damageMultiplier = 1;
            setTimeout(() => enemyAttack(), 1000);
            updateUI();
        }

        // Player Ability
        function playerAbility() {
            if (!gameState.gameRunning || !gameState.playerAbilityReady) {
                addLog('⚠️ Способность еще на перезарядке!');
                return;
            }

            addLog(`✨ GRINCHITA активирует способность "${gameState.abilityName}"!`);
            addLog('🛡️ Абсорб включен - следующий удар будет поглощен!');
            
            gameState.playerAbilityReady = false;
            
            // Recharge after 3 seconds
            setTimeout(() => {
                gameState.playerAbilityReady = true;
                addLog('✨ Способность готова к использованию!');
            }, 3000);
        }

        // Enemy Attack
        function enemyAttack() {
            if (!gameState.gameRunning) return;

            const damage = Math.floor(Math.random() * 50) + 50;
            gameState.playerHP -= damage;

            addLog(`💥 ВРАГ наносит ${damage} урона!`);
            showDamage('playerCastle', damage);
            destroyBlock(document.getElementById('playerCastle'));

            updateUI();
        }

        // Movement
        function moveForward() {
            if (!gameState.gameRunning) return;
            gameState.playerPosition = Math.min(gameState.playerPosition + 20, 100);
            addLog('→ Замок движется вперед!');
            updatePosition();
        }

        function moveBackward() {
            if (!gameState.gameRunning) return;
            gameState.playerPosition = Math.max(gameState.playerPosition - 20, 0);
            addLog('← Замок движется назад!');
            updatePosition();
        }

        function updatePosition() {
            const playerWrapper = document.getElementById('playerCastleWrapper');
            const enemyWrapper = document.getElementById('enemyCastleWrapper');
            
            const maxTranslate = window.innerWidth * 0.3;
            const playerTranslate = (gameState.playerPosition / 100) * maxTranslate - maxTranslate / 2;
            const enemyTranslate = ((100 - gameState.enemyPosition) / 100) * maxTranslate - maxTranslate / 2;
            
            playerWrapper.style.transform = `translateX(${playerTranslate}px)`;
            enemyWrapper.style.transform = `translateX(${-enemyTranslate}px)`;
        }

        // Round Timer
        function startRoundTimer() {
            const timerInterval = setInterval(() => {
                gameState.roundTime--;
                document.getElementById('roundTimer').textContent = gameState.roundTime;

                if (gameState.roundTime <= 0) {
                    gameState.round++;
                    gameState.roundTime = 60;
                    gameState.playerGold += 100;
                    gameState.enemyGold += 100;
                    addLog(`⏱️ Раунд ${gameState.round} начинается!`);
                    updateUI();
                }
            }, 1000);
        }

        // AI Logic
        function aiTurn() {
            if (!gameState.gameRunning) return;

            const actions = [
                () => {
                    const damage = Math.floor(Math.random() * 40) + 70;
                    gameState.playerHP -= damage;
                    addLog(`🤖 Враг атакует! Урон: ${damage}`);
                    showDamage('playerCastle', damage);
                    destroyBlock(document.getElementById('playerCastle'));
                },
                () => {
                    gameState.enemyHP = Math.min(gameState.enemyHP + 50, gameState.enemyMaxHP);
                    addLog('❤️ Враг использует исцеление!');
                    showDamage('enemyCastle', 50, 'heal');
                },
                () => {
                    gameState.enemyPosition = Math.min(gameState.enemyPosition + 20, 100);
                    addLog('→ Враг движется вперед!');
                    updatePosition();
                }
            ];

            if (Math.random() > 0.3) {
                actions[0](); // Mostly attack
            } else {
                actions[Math.floor(Math.random() * actions.length)]();
            }

            updateUI();
        }

        // Start Game
        addLog('🎮 Игра начинается!');
        addLog('🟢 GRINCHITA vs 🤖 ВРАГ');
        addLog('⚔️ Начните атаковать!');

        startRoundTimer();

        // Auto AI attacks every 5 seconds
        setInterval(() => {
            if (gameState.gameRunning) {
                aiTurn();
            }
        }, 5000);

        updateUI();
    </script>
</body>
</html>
