<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1d2340">
  <title>Castle Busters — Осада замков</title>
  <meta name="description" content="Castle Busters: дуэль замков на колёсах. Стреляй юнитами, ломай стены и обрушивай вражескую крепость.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%224%22 y=%2210%22 width=%2224%22 height=%2216%22 fill=%22%23c9d1d9%22 stroke=%22%231d2340%22 stroke-width=%222%22/%3E%3Cpath d=%22M6 10 L10 3 L14 10Z M18 10 L22 3 L26 10Z%22 fill=%22%233d7bf0%22 stroke=%22%231d2340%22 stroke-width=%222%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Russo+One&display=swap&subset=cyrillic" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
  <canvas id="game" aria-label="Поле боя"></canvas>

  <section id="loading" class="screen">
    <div class="logo">
      <div class="logo-title">CASTLE<br><span class="b">BUSTERS</span></div>
      <div class="logo-sub">Осада замков на колёсах</div>
    </div>
    <div class="tap">
      <div class="loadbar"><div id="loadfill"></div></div>
      <button id="btn-start" class="btn btn-gold btn-big hidden">Играть</button>
    </div>
  </section>

  <section id="menu" class="screen hidden">
    <div class="topbar">
      <div class="player-chip">
        <div class="avatar" id="m-avatar">И<span class="lvl" id="m-level">1</span></div>
        <div><div class="nm" id="m-name">Игрок</div><div class="xpbar"><div id="m-xp"></div></div></div>
      </div>
      <div class="spacer"></div>
      <div class="pill"><span class="ico ico-cup">🏆</span><span id="m-trophies">0</span></div>
      <div class="pill"><span class="ico ico-coin"></span><span id="m-coins">0</span></div>
      <button class="icon-btn" id="btn-sound" aria-label="Звук">🔊</button>
    </div>
    <div class="logo"><div class="logo-title">CASTLE<br><span class="b">BUSTERS</span></div></div>
    <div class="home-center" id="home">
      <div class="league-card" id="league-card">
        <div class="league-badge" id="m-badge"><span>Б</span></div>
        <div class="league-info">
          <div class="ln" id="m-league">Бронза</div>
          <div class="an" id="m-arena">Долина водопадов</div>
          <div class="progress"><div id="m-prog"></div></div>
          <div class="pt" id="m-next">До Серебра: 300</div>
        </div>
      </div>
      <button class="btn btn-gold btn-big" id="btn-battle">В бой</button>
    </div>
    <div id="sheet" class="sheet hidden"><div class="sheet-inner" id="sheet-inner"></div></div>
    <nav class="nav" id="nav">
      <button data-tab="home" class="active"><span class="ni">🏰</span>Главная</button>
      <button data-tab="squad"><span class="ni">🛡️</span>Отряд</button>
      <button data-tab="forge"><span class="ni">⚒️</span>Кузница</button>
      <button data-tab="arena"><span class="ni">🏆</span>Арены</button>
    </nav>
  </section>

  <section id="match" class="screen hidden">
    <div id="mm-search">
      <div class="mm-spinner" style="margin:0 auto 20px"></div>
      <div class="mm-title" style="text-align:center">Поиск соперника…</div>
      <div class="mm-sub" id="mm-arena" style="text-align:center;margin-top:8px"></div>
    </div>
    <div id="mm-found" class="hidden" style="text-align:center">
      <div class="mm-title" style="margin-bottom:18px">Соперник найден</div>
      <div class="vs-wrap">
        <div class="vs-card me"><div class="avatar" id="vs-me-av">И</div><div class="nm" id="vs-me">Вы</div><div class="tr" id="vs-me-tr"></div></div>
        <div class="vs-big">VS</div>
        <div class="vs-card op"><div class="avatar" id="vs-op-av" style="background:#a82e2a">С</div><div class="nm" id="vs-op">Соперник</div><div class="tr" id="vs-op-tr"></div></div>
      </div>
    </div>
    <button class="btn btn-small" id="btn-cancel-mm" style="margin-top:10px">Отмена</button>
  </section>

  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="side left">
        <div class="row1"><div class="avatar" id="h-pav">И</div><div class="who"><div class="nm" id="h-pname">Вы</div><div class="tr" id="h-ptr"></div></div><div class="pct" id="h-ppct">100%</div></div>
        <div class="cbar"><div id="h-pbar" style="width:100%"></div></div>
        <div class="minis" id="h-pminis"></div>
      </div>
      <div class="center-col">
        <div class="vs-chip">VS</div>
        <div class="round-chip" id="h-round">Раунд 1</div>
        <div class="timer" id="h-timer">20</div>
        <div class="wind hidden" id="h-wind"></div>
        <button class="icon-btn" id="btn-pause" aria-label="Пауза">II</button>
      </div>
      <div class="side right">
        <div class="row1"><div class="avatar" id="h-eav">С</div><div class="who"><div class="nm" id="h-ename">Соперник</div><div class="tr" id="h-etr"></div></div><div class="pct" id="h-epct">100%</div></div>
        <div class="cbar"><div id="h-ebar" style="width:100%"></div></div>
        <div class="minis" id="h-eminis"></div>
      </div>
    </div>
    <div class="hint hidden" id="hint"></div>
    <button class="btn btn-green use-btn hidden" id="btn-use">Применить</button>
    <div class="hud-bottom"><div class="cards" id="cards"></div></div>
  </div>

  <div id="banner" class="banner hidden"><div class="bt" id="banner-t"></div><div class="bs hidden" id="banner-s"></div></div>
  <div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>

  <script src="js/config.js?v=3"></script>
  <script src="js/audio.js?v=3"></script>
  <script src="js/save.js?v=3"></script>
  <script src="js/art.js?v=3"></script>
  <script src="js/battle.js?v=3"></script>
  <script src="js/ui.js?v=3"></script>
</body>
</html>
